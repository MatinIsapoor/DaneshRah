{# Shared line-icon set. All icons are decorative; the surrounding control or
   text supplies the accessible name. Keep the 24×24 grid and 1.75 stroke. #}
{% macro icon(name, cls='icon') -%}
<svg class="{{ cls }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
  {%- if name == 'search' -%}
  <circle cx="11" cy="11" r="7"/><path d="m20.5 20.5-4.2-4.2"/>
  {%- elif name == 'arrow-left' -%}
  <path d="M19 12H5"/><path d="m11 18-6-6 6-6"/>
  {%- elif name == 'arrow-right' -%}
  <path d="M5 12h14"/><path d="m13 6 6 6-6 6"/>
  {%- elif name == 'arrow-up' -%}
  <path d="M12 19V5"/><path d="m6 11 6-6 6 6"/>
  {%- elif name == 'chevron-down' -%}
  <path d="m6 9 6 6 6-6"/>
  {%- elif name == 'external' -%}
  <path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M20 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h5"/>
  {%- elif name == 'check' -%}
  <path d="m5 12.5 4.2 4.2L19 7"/>
  {%- elif name == 'check-circle' -%}
  <circle cx="12" cy="12" r="9"/><path d="m8 12 2.8 2.8L16.5 9"/>
  {%- elif name == 'alert' -%}
  <path d="M12 8.5v5"/><path d="M12 17h.01"/><path d="M10.3 4.2 2.6 17.5A2 2 0 0 0 4.3 20h15.4a2 2 0 0 0 1.7-2.5L13.7 4.2a2 2 0 0 0-3.4 0Z"/>
  {%- elif name == 'clock' -%}
  <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/>
  {%- elif name == 'calendar' -%}
  <rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>
  {%- elif name == 'globe' -%}
  <circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.4 2.6 3.7 5.6 3.7 9s-1.3 6.4-3.7 9c-2.4-2.6-3.7-5.6-3.7-9S9.6 5.6 12 3Z"/>
  {%- elif name == 'map' -%}
  <path d="m3 6.5 5.5-2 7 2 5.5-2v13l-5.5 2-7-2-5.5 2v-13Z"/><path d="M8.5 4.5v13M15.5 6.5v13"/>
  {%- elif name == 'book' -%}
  <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/>
  {%- elif name == 'home' -%}
  <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V10Z"/><path d="M9 21v-8h6v8"/>
  {%- elif name == 'wallet' -%}
  <rect x="3" y="5" width="18" height="15" rx="2"/><path d="M3 9h18"/><path d="M16 14h2"/>
  {%- elif name == 'file' -%}
  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M8 13h8M8 17h6"/>
  {%- elif name == 'briefcase' -%}
  <rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
  {%- elif name == 'compass' -%}
  <circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2.1 5-5 2.1 2.1-5 5-2.1Z"/>
  {%- elif name == 'layers' -%}
  <path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 12 9 5 9-5"/><path d="m3 16 9 5 9-5"/>
  {%- elif name == 'print' -%}
  <path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="9" rx="2"/><path d="M6 14h12v7H6z"/>
  {%- elif name == 'link' -%}
  <path d="M10 13a5 5 0 0 0 7.5.5l2-2a5 5 0 0 0-7-7l-1.2 1.2"/><path d="M14 11a5 5 0 0 0-7.5-.5l-2 2a5 5 0 0 0 7 7l1.2-1.2"/>
  {%- elif name == 'shield' -%}
  <path d="M12 22s8-3.8 8-10V5l-8-3-8 3v7c0 6.2 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/>
  {%- elif name == 'star' -%}
  <path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2-5.5-2.9-5.5 2.9 1-6.2L3 9.6l6.2-.9L12 3Z"/>
  {%- elif name == 'x' -%}
  <path d="m6 6 12 12M18 6 6 18"/>
  {%- elif name == 'menu' -%}
  <path d="M4 7h16M4 12h16M4 17h16"/>
  {%- elif name == 'moon' -%}
  <path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2Z"/>
  {%- elif name == 'sun' -%}
  <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
  {%- elif name == 'github' -%}
  <path d="M15 22v-3.9c.04-1-.35-2-1.1-2.6 3.6-.4 7.4-1.8 7.4-8A6.3 6.3 0 0 0 19.6 2.8 5.9 5.9 0 0 0 19.4 0S18.2-.4 15.5 1.4a15 15 0 0 0-7 0C5.8-.4 4.6 0 4.6 0a5.9 5.9 0 0 0-.2 2.8A6.3 6.3 0 0 0 2.7 7.5c0 6.2 3.8 7.6 7.4 8-.7.6-1.1 1.5-1.1 2.5V22"/><path d="M9 19c-3 .9-3-1.5-4.5-2"/>
  {%- elif name == 'info' -%}
  <circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>
  {%- endif -%}
</svg>
{%- endmacro %}

{% macro logo(cls='brand-mark') -%}
<svg class="{{ cls }}" viewBox="0 0 40 40" aria-hidden="true" focusable="false">
  <rect width="40" height="40" rx="11" fill="var(--mark-bg)"/>
  <path d="M10 30c0-9.2 5.6-14.4 14.5-14.4h5" fill="none" stroke="var(--mark-stroke)" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M13.5 34c0-9.2 5.6-14.4 14.5-14.4h2" fill="none" stroke="var(--mark-gold)" stroke-width="2.2" stroke-linecap="round" opacity=".9"/>
  <circle cx="29.5" cy="15.6" r="3.1" fill="var(--mark-dot)"/>
</svg>
{%- endmacro %}
