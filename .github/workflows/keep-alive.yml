# External pinger: reliable backup so Render free instance never idles 15 min.
# Self-ping inside app.py helps, but an external ping is what guarantees traffic.
#
# This workflow pings the public Render URL every 10 minutes.

name: keep-render-awake

on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          curl -fsS --max-time 30 "https://daneshrah.onrender.com/health" || \
          curl -fsS --max-time 30 "https://daneshrah.onrender.com/ping"
