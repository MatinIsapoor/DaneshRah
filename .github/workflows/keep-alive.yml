# External pinger: reliable backup so Render free instance never idles 15 min.
# Self-ping inside app.py helps, but an external ping is what guarantees traffic.
#
# Setup (one time):
#   1. Go to repo Settings > Secrets and variables > Actions > New repository secret
#      Name: RENDER_URL  Value: https://your-app.onrender.com
#   2. Push this file — it pings /health every 10 minutes.
#
# No secret? Replace ${{ secrets.RENDER_URL }} below with your URL directly.

name: keep-render-awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          curl -fsS --max-time 30 "${{ secrets.RENDER_URL }}/health" || \
          curl -fsS --max-time 30 "${{ secrets.RENDER_URL }}/ping"
